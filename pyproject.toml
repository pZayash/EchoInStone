[tool.poetry]
name = "EchoInStone"
version = "0.1.0"
description = "A tool to extract and transcribe audio."
authors = ["Jean-Jerome Levy"]
packages = [
    { include = "EchoInStone" }
]

[tool.poetry.dependencies]
python = "3.12.*"
pytubefix = "^8.12.1"
feedparser = "^6.0.11"
requests = "^2.32.3"
transformers = "^4.50.0"
torch = {version = "2.7.0", source = "pytorch-xpu"}
pyannote-audio = "^3.3.2"
pydub = "^0.25.1"
accelerate = "^1.3.0"
jinja2 = "^3.1.6"

[[tool.poetry.source]]
name = "pytorch-xpu"
url = "https://download.pytorch.org/whl/xpu"
priority = "supplemental"

[tool.poetry.group.dev.dependencies]
pytest-bdd = "^8.1.0"
pytest-cov = "^6.0.0"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
echotranscriber = "main:main"
